# Next.js 정적 export → out/ 배포
[build]
  # 모든 빌드(production 포함)는 정적 산출물만 만든다. IndexNow 변경 URL 알림은
  # build command 가 아니라 아래 플러그인의 onSuccess 에서, production 컨텍스트이고
  # 새 배포가 https://reumlab.com 에 공개된 것을 확인한 뒤에만 보낸다.
  command = "npm run build"
  publish = "out"

[context.production]
  command = "npm run build"

[[plugins]]
  package = "./netlify/plugins/indexnow-after-deploy"

[[headers]]
  for = "/ai-search-optimization/"
  [headers.values]
    Link = "<https://reumlab.com/ai-search-optimization/>; rel=canonical"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
