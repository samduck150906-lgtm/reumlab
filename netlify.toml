# Next.js 정적 export → out/ 배포
[build]
  # 모든 preview/branch/dev 빌드는 정적 산출물만 만든다. IndexNow는 아래
  # production 컨텍스트에서만 명시적 --submit 경로로 실행한다.
  command = "npm run build"
  publish = "out"

[context.production]
  command = "npm run build && npm run seo:indexnow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
