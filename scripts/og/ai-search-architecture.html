<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>OG — AI Search Architecture</title>
<!--
  /ai-search-optimization/ 공유 카드(og:image)의 원본.

  왜 HTML 인가
   이 저장소에는 이미지 합성 라이브러리가 없고, 이미지 하나 만들려고 유료 생성 API 를
   쓰거나 새 런타임 의존성을 추가하지 않는다. 대신 이 파일을 헤드리스 크로미움으로
   1200×630 스크린샷을 찍어 public/og-ai-search-architecture.png 를 만든다.
   문구·색을 고칠 때는 이 파일을 고치고 다시 렌더한다(아래 명령 참고).

  렌더 방법 (playwright 가 있는 환경에서 1회 수동 실행)
    node -e "const{chromium}=require('playwright');(async()=>{const b=await chromium.launch();\
    const p=await b.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1});\
    await p.goto('file://'+process.cwd()+'/scripts/og/ai-search-architecture.html');\
    await p.evaluate(()=>document.fonts.ready);\
    await p.screenshot({path:'public/og-ai-search-architecture.jpg',type:'jpeg',quality:88});\
    await b.close();})()"

  지키는 규칙
   · 실제 브랜드 자산(public/logo.png)과 현재 팔레트(app/globals.css 토큰)만 쓴다.
   · 근거 없는 수치·배지·수상·고객 로고·가짜 AI 답변 화면을 넣지 않는다.
   · 이미지는 본문 설명을 대신하지 않는다 — 여기 문구는 화면 H1·설명과 같은 뜻이다.
-->
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('../../public/fonts/PretendardVariable-1.3.9.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    font-family: 'Pretendard', system-ui, sans-serif;
    color: #f5f8ff;
    background:
      radial-gradient(760px 520px at 88% 4%, rgba(40, 94, 219, .42), transparent 68%),
      radial-gradient(520px 420px at 4% 96%, rgba(127, 168, 255, .16), transparent 70%),
      linear-gradient(150deg, #0a1830 0%, #102544 58%, #16305a 100%);
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 46px; height: 46px; }
  .brand b { font-size: 27px; font-weight: 800; letter-spacing: .12em; }
  .eyebrow {
    margin-top: 6px; color: #abc4ff; font-size: 19px; font-weight: 800; letter-spacing: .17em;
  }
  h1 {
    margin-top: 20px; font-size: 78px; font-weight: 800; line-height: 1.2;
    letter-spacing: -.045em; word-break: keep-all;
  }
  h1 em { font-style: normal; color: #8fb4ff; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; }
  .tags { display: flex; gap: 10px; }
  .tags span {
    padding: 11px 19px; border: 1px solid rgba(171, 196, 255, .34); border-radius: 999px;
    color: #dce7ff; font-size: 20px; font-weight: 700;
  }
  .domain { color: rgba(235, 241, 252, .66); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <img src="../../public/logo.png" alt="" />
      <b>REUMLAB</b>
    </div>
    <p class="eyebrow">AI SEARCH ARCHITECTURE</p>
    <h1>기존 홈페이지<br /><em>AI 검색 구조 개선</em></h1>
  </div>
  <div class="foot">
    <div class="tags"><span>SEO</span><span>GEO</span><span>AEO</span><span>네이버 웹검색</span></div>
    <span class="domain">reumlab.com</span>
  </div>
</body>
</html>
