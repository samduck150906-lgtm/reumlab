<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 | 름랩 Reum Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 20px; padding: 48px 36px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); }
        .icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 40px; }
        .icon.success { background: rgba(34,197,94,0.2); }
        .icon.loading { background: rgba(61,124,255,0.2); animation: pulse 1.5s infinite; }
        .icon.error { background: rgba(239,68,68,0.2); }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
        h1 { font-size: 22px; color: #f8fafc; margin-bottom: 12px; }
        .desc { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .info-box { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; text-align: left; margin-bottom: 24px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; gap: 12px; }
        .info-row:last-child { border: none; }
        .info-label { color: #94a3b8; flex-shrink: 0; }
        .info-value { color: #f1f5f9; font-weight: 600; text-align: right; word-break: break-all; }
        .btn { display: inline-block; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #3d7cff; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .footer { margin-top: 28px; font-size: 11px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status-icon" class="icon loading">⏳</div>
        <h1 id="status-title">결제 승인 처리 중...</h1>
        <p id="status-desc" class="desc">토스페이먼츠 결제 승인을 진행하고 있습니다. 잠시만 기다려 주세요.</p>
        <div id="info-box" class="info-box" style="display:none;"></div>
        <div id="action-area"></div>
        <div class="footer">
            이터널식스<br>
            대표자: 성아름 · 사업자등록번호: 303-28-65658<br>
            통신판매업: 제 2025-수원영통-1499호 · 연락처: 010-8111-9370<br>
            주소: 경기도 수원시 영통구 삼성로 186-1 4층 · 이메일: ceo@eternalsix.kr
        </div>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var paymentKey = params.get('paymentKey');
        var orderId = params.get('orderId');
        var amount = params.get('amount');

        async function confirmPayment() {
            if (!paymentKey || !orderId || !amount) {
                showError('결제 정보가 누락되었습니다.');
                return;
            }
            try {
                var res = await fetch('/.netlify/functions/confirm-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: Number(amount) }),
                });
                var data = await res.json();
                if (res.ok && data.status === 'DONE') {
                    showSuccess(data);
                } else {
                    showError(data.message || '결제 승인에 실패했습니다.');
                }
            } catch (e) {
                showError('서버 연결에 실패했습니다. 고객센터로 문의해 주세요.');
            }
        }

        function showSuccess(data) {
            document.getElementById('status-icon').className = 'icon success';
            document.getElementById('status-icon').textContent = '✅';
            document.getElementById('status-title').textContent = '결제가 완료되었습니다';
            document.getElementById('status-desc').textContent = '주문이 정상 처리되었습니다. 곧 연락드리겠습니다.';
            var box = document.getElementById('info-box');
            box.style.display = 'block';
            box.innerHTML =
                '<div class="info-row"><span class="info-label">주문번호</span><span class="info-value">' + (data.orderId || orderId) + '</span></div>' +
                '<div class="info-row"><span class="info-label">결제금액</span><span class="info-value">' + Number(amount).toLocaleString('ko-KR') + '원</span></div>' +
                '<div class="info-row"><span class="info-label">결제수단</span><span class="info-value">' + (data.method || '-') + '</span></div>' +
                '<div class="info-row"><span class="info-label">승인일시</span><span class="info-value">' + new Date().toLocaleString('ko-KR') + '</span></div>';
            document.getElementById('action-area').innerHTML =
                '<a href="/" class="btn btn-primary">홈으로</a>';
        }

        function showError(msg) {
            document.getElementById('status-icon').className = 'icon error';
            document.getElementById('status-icon').textContent = '❌';
            document.getElementById('status-title').textContent = '결제 승인 실패';
            document.getElementById('status-desc').textContent = msg;
            document.getElementById('action-area').innerHTML =
                '<a href="/#pricing" class="btn btn-primary">패키지 선택으로</a>';
        }

        confirmPayment();
    </script>
</body>
</html>
