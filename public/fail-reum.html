<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 | 름랩 Reum Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 20px; padding: 48px 36px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); }
        .icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(239,68,68,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 40px; }
        h1 { font-size: 22px; color: #f8fafc; margin-bottom: 12px; }
        .desc { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
        .error-code { background: rgba(127,29,29,0.25); border: 1px solid rgba(248,113,113,0.25); border-radius: 10px; padding: 12px; font-family: ui-monospace, monospace; font-size: 12px; color: #fecaca; margin: 16px 0 24px; word-break: break-all; }
        .btn { display: inline-block; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s; margin: 4px; }
        .btn-primary { background: #3d7cff; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .footer { margin-top: 28px; font-size: 11px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">😔</div>
        <h1>결제에 실패했습니다</h1>
        <p class="desc" id="fail-message">결제 처리 중 문제가 발생했습니다.</p>
        <div class="error-code" id="error-detail"></div>
        <div>
            <a href="/checkout-reum.html" class="btn btn-primary">다시 결제</a>
            <a href="/#pricing" class="btn btn-secondary">패키지 선택</a>
        </div>
        <div class="footer">
            이터널식스<br>
            대표자: 성아름 · 사업자등록번호: 303-28-65658<br>
            통신판매업: 제 2025-수원영통-1499호 · 연락처: 010-8111-9370<br>
            주소: 경기도 수원시 영통구 삼성로 186-1 4층 · 이메일: ceo@eternalsix.kr
        </div>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code') || 'UNKNOWN_ERROR';
        var message = params.get('message') || '알 수 없는 오류가 발생했습니다.';
        (function () {
            var m = message;
            try { m = decodeURIComponent(message.replace(/\+/g, ' ')); } catch (e) {}
            document.getElementById('fail-message').textContent = m;
        })();
        document.getElementById('error-detail').textContent = '오류 코드: ' + code;
    </script>
</body>
</html>
