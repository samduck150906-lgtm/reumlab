<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>패키지 결제 | 름랩 Reum Lab</title>
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1f3a; padding: 20px; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 560px; margin: 32px auto; background: #132447; padding: 32px 28px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; text-align: center; color: #fff; }
        .sub { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        .product-info { padding: 18px; background: rgba(255,255,255,0.04); border-radius: 12px; margin-bottom: 22px; border: 1px solid rgba(255,255,255,0.08); }
        .tier { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #7dd3fc; margin-bottom: 6px; }
        .product-title { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.4; }
        .price { font-size: 26px; font-weight: 800; color: #fff; margin-top: 10px; letter-spacing: -0.02em; }
        .vat { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; font-size: 14px; outline: none; background: rgba(10,22,40,0.6); color: #f1f5f9; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #3d7cff; box-shadow: 0 0 0 3px rgba(61,124,255,0.2); }
        .form-group input::placeholder { color: #64748b; }
        .pay-btn { display: block; width: 100%; background: #3d7cff; color: white; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
        .pay-btn:hover { background: #2563eb; }
        .pay-btn:disabled { background: #475569; cursor: not-allowed; }
        .back { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #94a3b8; }
        .back a { color: #7dd3fc; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
        .footer { margin-top: 28px; font-size: 11px; color: #64748b; text-align: center; line-height: 1.7; }
        .footer a { color: #7dd3fc; text-decoration: none; }
        .err { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fecaca; padding: 14px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">패키지 결제</h1>
        <p class="sub" id="page-sub">토스페이먼츠 안전 결제</p>

        <div id="error-box" class="err" style="display:none;"></div>

        <div id="checkout-body" style="display:none;">
            <div class="product-info">
                <div class="tier" id="pkg-tier"></div>
                <div class="product-title" id="pkg-title"></div>
                <div class="price" id="pkg-price"></div>
                <div class="vat">부가세(VAT) 포함 금액</div>
            </div>

            <div class="form-group">
                <label for="customer-name">주문자 이름 <span style="color:#f87171">*</span></label>
                <input type="text" id="customer-name" placeholder="홍길동" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="customer-email">이메일 <span style="color:#f87171">*</span></label>
                <input type="email" id="customer-email" placeholder="example@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="customer-phone">연락처</label>
                <input type="tel" id="customer-phone" placeholder="010-0000-0000" autocomplete="tel">
            </div>

            <div id="payment-method"></div>
            <div id="agreement"></div>

            <button type="button" id="payment-button" class="pay-btn" disabled>주문자 정보를 입력하세요</button>
        </div>

        <p class="back"><a href="/#pricing">← 패키지 선택으로 돌아가기</a></p>

        <div class="footer">
            <a href="/terms.html">이용약관</a> · <a href="/privacy.html">개인정보처리방침</a> · <a href="/refund.html">취소 및 환불 안내</a><br><br>
            이터널식스<br>
            대표자: 성아름 · 사업자등록번호: 303-28-65658<br>
            통신판매업: 제 2025-수원영통-1499호 · 연락처: 010-8111-9370<br>
            주소: 경기도 수원시 영통구 삼성로 186-1 4층 · 이메일: ceo@eternalsix.kr
        </div>
    </div>

    <script>
        (function () {
            var PACKAGE_MAP = {
                standard: {
                    tier: 'STANDARD',
                    title: '웹 개발 + 강의',
                    amount: 1490000,
                    orderName: '[Reum Lab] STANDARD 웹 개발 + 강의 (VAT포함)',
                },
                deluxe: {
                    tier: 'DELUXE',
                    title: '앱 개발 + 강의',
                    amount: 4990000,
                    orderName: '[Reum Lab] DELUXE 앱 개발 + 강의 (VAT포함)',
                },
                premium: {
                    tier: 'PREMIUM',
                    title: '고도화된 앱 또는 웹 개발 + 강의',
                    amount: 7990000,
                    orderName: '[Reum Lab] PREMIUM 고도화 앱/웹 + 강의 (VAT포함)',
                },
            };

            var params = new URLSearchParams(window.location.search);
            var key = (params.get('package') || '').toLowerCase().trim();
            var pkg = PACKAGE_MAP[key];

            var errorBox = document.getElementById('error-box');
            var checkoutBody = document.getElementById('checkout-body');

            if (!pkg) {
                errorBox.style.display = 'block';
                errorBox.textContent = '유효한 패키지가 선택되지 않았습니다. 랜딩 페이지에서 패키지를 다시 선택해 주세요.';
                document.getElementById('page-title').textContent = '결제를 시작할 수 없습니다';
                document.getElementById('page-sub').textContent = '';
                return;
            }

            checkoutBody.style.display = 'block';
            document.getElementById('pkg-tier').textContent = pkg.tier;
            document.getElementById('pkg-title').textContent = pkg.title;
            document.getElementById('pkg-price').textContent = pkg.amount.toLocaleString('ko-KR') + '원';

            var clientKey = 'live_gck_ZLKGPx4M3MpG0OOEvlW78BaWypv1';
            var customerKey = 'reum_' + Math.random().toString(36).substring(2, 14);
            var paymentWidget = PaymentWidget(clientKey, customerKey);
            paymentWidget.renderPaymentMethods('#payment-method', { value: pkg.amount });
            paymentWidget.renderAgreement('#agreement');

            var nameInput = document.getElementById('customer-name');
            var emailInput = document.getElementById('customer-email');
            var payBtn = document.getElementById('payment-button');

            function validateForm() {
                var valid = nameInput.value.trim().length >= 1 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput.value.trim());
                payBtn.disabled = !valid;
                payBtn.textContent = valid ? pkg.amount.toLocaleString('ko-KR') + '원 결제하기' : '주문자 정보를 입력하세요';
            }
            nameInput.addEventListener('input', validateForm);
            emailInput.addEventListener('input', validateForm);
            validateForm();

            payBtn.addEventListener('click', function () {
                payBtn.disabled = true;
                payBtn.textContent = '결제 처리 중...';
                var origin = window.location.origin;
                paymentWidget.requestPayment({
                    orderId: 'REUM_' + key.toUpperCase() + '_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
                    orderName: pkg.orderName,
                    amount: pkg.amount,
                    successUrl: origin + '/success-reum.html',
                    failUrl: origin + '/fail-reum.html',
                    customerEmail: emailInput.value.trim(),
                    customerName: nameInput.value.trim(),
                }).catch(function () {
                    payBtn.disabled = false;
                    validateForm();
                });
            });
        })();
    </script>
</body>
</html>
