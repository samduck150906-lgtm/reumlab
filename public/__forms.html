<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Netlify Forms 감지 전용 파일.
      /soho 폼은 React(SohoForm.tsx)로 렌더되어 빌드 환경에 따라 Netlify 봇이
      못 읽을 수 있어, 동일한 name·필드를 가진 정적 폼을 여기에 둬서 확실히 감지시킵니다.
      실제 제출은 SohoForm이 fetch로 처리합니다. 이 파일은 화면에 노출되지 않습니다(noindex).
      필드 name을 바꾸면 이 파일도 함께 수정하세요.
    -->
    <form name="soho-diagnosis" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="soho-diagnosis" />
      <input type="text" name="이름" />
      <input type="text" name="연락처" />
      <input type="checkbox" name="진단항목" value="네이버 플레이스" />
      <input type="checkbox" name="진단항목" value="당근 마케팅" />
      <input type="checkbox" name="진단항목" value="스마트스토어" />
      <input type="checkbox" name="진단항목" value="전체 상담 희망" />
      <textarea name="상호명"></textarea>
      <input type="checkbox" name="이용약관동의" value="동의" />
      <input type="checkbox" name="개인정보동의" value="동의" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="hidden" name="utm_term" />
      <input type="hidden" name="최초_유입_페이지" />
      <input type="hidden" name="유입_채널" />
      <input type="hidden" name="fbclid" />
      <input name="bot-field" />
    </form>

    <!--
      메인 페이지(index.html) 상단·하단 신청 폼(name="main-apply") 감지용 정적 폼.
      index.html은 정적 파일이라 그대로도 감지되지만, 확실히 하기 위해 함께 등록합니다.
      /ai-search-optimization/ 변형은 여기에 홈페이지주소상태·홈페이지환경·수정권한·
      관심패키지·지속관리관심을 더한다(비밀번호·API 키를 받는 필드는 두지 않는다).
      /ai-voice-development/ 변형은 음성_업종·음성_하루전화량·음성_관심상품을 더한다
      (필드 이름의 단일 출처는 lib/ai-voice-form.ts 의 VOICE_FIELD_NAMES — 함께 고칠 것).
      Netlify 는 여기에 등록되지 않은 이름을 접수에서 버릴 수 있으므로, 폼에 필드를
      추가하면 이 파일에도 반드시 같은 이름을 추가한다.
      수집 항목: 이름 · 업체명 · 휴대폰번호 (+ 광고 유입 추적 utm_*·fbclid,
      + 유입 맥락 유입_경로·페이지_유형·관심_서비스축·유입_출처·최초_유입_페이지·유입_채널
      — 어떤 SEO 페이지와 채널이 문의를 만드는지 추적용).
    -->
    <form name="main-apply" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="main-apply" />
      <input type="text" name="이름" />
      <input type="tel" name="휴대폰번호" />
      <input type="email" name="이메일" />
      <input type="text" name="서비스유형" />
      <input type="hidden" name="문의서비스" />
      <input type="url" name="현재홈페이지주소" />
      <input type="text" name="의뢰유형" />
      <input type="text" name="현재응대방식" />
      <input type="text" name="연동대상시스템" />
      <input type="text" name="홈페이지주소상태" />
      <input type="text" name="홈페이지환경" />
      <input type="text" name="수정권한" />
      <input type="text" name="관심패키지" />
      <input type="text" name="지속관리관심" />
      <input type="text" name="음성_업종" />
      <input type="text" name="음성_하루전화량" />
      <input type="text" name="음성_관심상품" />
      <textarea name="핵심기능"></textarea>
      <input type="text" name="예상예산" />
      <input type="text" name="희망일정" />
      <input type="text" name="참고서비스" />
      <input type="checkbox" name="개인정보동의" value="동의" />
      <input type="hidden" name="유입_랜딩" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="hidden" name="utm_term" />
      <input type="hidden" name="fbclid" />
      <input type="hidden" name="유입_경로" />
      <input type="hidden" name="페이지_유형" />
      <input type="hidden" name="관심_서비스축" />
      <input type="hidden" name="유입_출처" />
      <input type="hidden" name="최초_유입_페이지" />
      <input type="hidden" name="유입_채널" />
      <input name="bot-field" />
    </form>
  </body>
</html>
